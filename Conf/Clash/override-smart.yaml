# ==========================================================
# 当前为override配置, 等效于手动填写订阅地址的smart-lite.yaml(无法分离多个订阅)
# 可直接远程获取并覆写订阅配置
# ========================= 基本锚点 =========================
# # 基本策略组
# ## 基础类型
BaseProxyGroup: &base_PG {lazy: true}
BasePGDirect: &bpg_direct {<<: *base_PG, type: select, hidden: true, proxies: [DIRECT]}
BasePGReject: &bpg_reject {<<: *base_PG, type: select, hidden: true, proxies: [REJECT]}
BasePGDrop: &bpg_drop {<<: *base_PG, type: select, hidden: true, proxies: [REJECT-DROP]}

# ## 策略类型
ProxyGroupSE: &pg_se {<<: *base_PG, type: select}
ProxyGroupSE_Hide: &pg_se_h {<<: *base_PG, type: select, hidden: true}

ProxyGroupUT: &pg_ut {<<: *base_PG, type: url-test}
ProxyGroupUT_Hide: &pg_ut_h {<<: *base_PG, type: url-test, hidden: true}

ProxyGroupFB: &pg_fb {<<: *base_PG, type: fallback}
ProxyGroupFB_Hide: &pg_fb_h {<<: *base_PG, type: fallback, hidden: true}

ProxyGroupSM: &pg_sm {<<: *base_PG, type: smart, uselightgbm: true}
ProxyGroupSM_Hide: &pg_sm_h {<<: *base_PG, type: smart, hidden: true, uselightgbm: true}

# # 过滤器
BaseFilter: &base_filter '^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))'

FilterFor_HR: &filterForHR '^(?=.*(?:[2-9][0-9]*|[1-9][0-9]+\.[0-9]+)[×x]).*$'
FilterOut_HR: &filterOutHR '^(?!.*(?:[2-9][0-9]*|[1-9][0-9]*\.[0-9]+)[×x]).*$'

FilterFor_NR: &filterForNR '^(?!.*(?:[2-9][0-9]*|[1-9][0-9]*\.[0-9]+|0\.0?[0-9]+)[×x]).*$'
FilterOut_NR: &filterOutNR '^(?!.*[×x]).*$'

FilterFor_LR: &filterForLR '^(?=.*(?:0\.1[×x]|0\.01[×x]|0\.1\b|0\.0[0-9])).*$'
FilterOut_LR: &filterOutLR '^(?!.*(?:0\.1[×x]|0\.01[×x]|0\.1\b|0\.0[0-9])).*$'

FilterOutLR_HK: &filterOutLR_HK '^(?i)(?!.*(0\.1[×x]|0\.01[×x]|0\.1\b|0\.0[0-9]))(?=.*(🇭🇰|香港|\b(HK|HongKong|Hong Kong)\b)).*$'
FilterOutLR_TW: &filterOutLR_TW '^(?i)(?!.*(0\.1[×x]|0\.01[×x]|0\.1\b|0\.0[0-9]))(?=.*(🇨🇳|🇹🇼|台湾|\b(TW|Taiwan)\b)).*$'
FilterOutLR_JP: &filterOutLR_JP '^(?i)(?!.*(0\.1[×x]|0\.01[×x]|0\.1\b|0\.0[0-9]))(?=.*(🇯🇵|日本|\b(JP|Japan)\b)).*$'
FilterOutLR_KR: &filterOutLR_KR '^(?i)(?!.*(0\.1[×x]|0\.01[×x]|0\.1\b|0\.0[0-9]))(?=.*(🇰🇷|韩国|\b(KR|South Korea)\b)).*$'
FilterOutLR_US: &filterOutLR_US '^(?i)(?!.*(0\.1[×x]|0\.01[×x]|0\.1\b|0\.0[0-9]))(?=.*(🇺🇸|美国|\b(US|USA|United States)\b)).*$'
FilterOutLR_SG: &filterOutLR_SG '^(?i)(?!.*(0\.1[×x]|0\.01[×x]|0\.1\b|0\.0[0-9]))(?=.*(🇸🇬|新加坡|狮城|\b(SG|Singapore)\b)).*$'
FilterOutLR_OT: &filterOutLR_OT '^(?i)(?!.*(0\.1[×x]|0\.01[×x]|0\.1\b|0\.0[0-9]))(?!.*(🇭🇰|香港|\b(HK|HongKong|Hong Kong)\b|🇨🇳|🇹🇼|台湾|\b(TW|Taiwan)\b|🇯🇵|日本|\b(JP|Japan)\b|🇰🇷|韩国|\b(KR|South Korea)\b|🇺🇸|美国|\b(US|USA|United States)\b|🇸🇬|新加坡|狮城|\b(SG|Singapore)\b)).*$'

# # 全局策略组
GlobalPG_GLOBAL: &gpg_global {type: select, proxies: [🚀 自动选择, ♻️ 智能选择, 👋 手动选择, 🎯 直接连接]}
GlobalPG_AUTO: &gpg_auto {<<: *pg_ut, proxies: [🇭🇰 香港自动, 🇨🇳 台湾自动, 🇯🇵 日本自动, 🇰🇷 韩国自动, 🇺🇸 美国自动, 🇸🇬 狮城自动]}

# macOS的客户端还无法从smart策略组临时select
# GlobalPG_SMART: &gpg_smart {<<: *pg_sm, proxies: [🇭🇰 香港智能, 🇨🇳 台湾智能, 🇯🇵 日本智能, 🇰🇷 韩国智能, 🇺🇸 美国智能, 🇸🇬 狮城智能]}
GlobalPG_SMART: &gpg_smart {<<: *pg_se, proxies: [🇭🇰 香港智能, 🇨🇳 台湾智能, 🇯🇵 日本智能, 🇰🇷 韩国智能, 🇺🇸 美国智能, 🇸🇬 狮城智能]}

GlobalPG_MANUAL: &gpg_manual {<<: *pg_se}

# ## 自定义smart
SmartHK: &s_hk {<<: *pg_sm, policy-priority: '🇭🇰:6;🇨🇳:5;🇯🇵:4;🇰🇷:3;🇺🇸:2;🇸🇬:1'}
SmartTW: &s_tw {<<: *pg_sm, policy-priority: '🇭🇰:5;🇨🇳:6;🇯🇵:4;🇰🇷:3;🇺🇸:2;🇸🇬:1'}
SmartJP: &s_jp {<<: *pg_sm, policy-priority: '🇭🇰:4;🇨🇳:5;🇯🇵:6;🇰🇷:3;🇺🇸:2;🇸🇬:1'}
SmartKR: &s_kr {<<: *pg_sm, policy-priority: '🇭🇰:3;🇨🇳:4;🇯🇵:5;🇰🇷:6;🇺🇸:2;🇸🇬:1'}
SmartUS: &s_us {<<: *pg_sm, policy-priority: '🇭🇰:2;🇨🇳:3;🇯🇵:4;🇰🇷:5;🇺🇸:6;🇸🇬:1'}
SmartSG: &s_sg {<<: *pg_sm, policy-priority: '🇭🇰:1;🇨🇳:2;🇯🇵:3;🇰🇷:4;🇺🇸:5;🇸🇬:6'}

# ## 自定义默认初始选择
HeadGlobal: &head_global {type: select, proxies: [🌐 全局选择, 🎯 直接连接, 🚀 自动选择, ♻️ 智能选择, 👋 手动选择, ♿️ 低倍选择, 🈲 禁止访问, ⚪ 丢弃请求,🇭🇰 香港自动, 🇭🇰 香港智能, 🇨🇳 台湾自动, 🇨🇳 台湾智能, 🇯🇵 日本自动, 🇯🇵 日本智能, 🇰🇷 韩国自动, 🇰🇷 韩国智能, 🇺🇸 美国自动, 🇺🇸 美国智能, 🇸🇬 狮城自动, 🇸🇬 狮城智能, 🌍 其他自动, 🌍 其他智能]}
HeadDirect: &head_direct {type: select, proxies: [🎯 直接连接, 🌐 全局选择, 🚀 自动选择, ♻️ 智能选择, 👋 手动选择, ♿️ 低倍选择, 🈲 禁止访问, ⚪ 丢弃请求,🇭🇰 香港自动, 🇭🇰 香港智能, 🇨🇳 台湾自动, 🇨🇳 台湾智能, 🇯🇵 日本自动, 🇯🇵 日本智能, 🇰🇷 韩国自动, 🇰🇷 韩国智能, 🇺🇸 美国自动, 🇺🇸 美国智能, 🇸🇬 狮城自动, 🇸🇬 狮城智能, 🌍 其他自动, 🌍 其他智能]}
HeadReject: &head_reject {type: select, proxies: [🈲 禁止访问, ⚪ 丢弃请求, 🎯 直接连接, 🌐 全局选择, 🚀 自动选择, ♻️ 智能选择, 👋 手动选择, ♿️ 低倍选择]}
# ========================= 核心配置 =========================
mode: rule
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
ipv6: false
allow-lan: false
unified-delay: true
tcp-concurrent: true
log-level: warning
bind-address: '*'
find-process-mode: 'always'
keep-alive-idle: 600
keep-alive-interval: 15

authentication:
  - mihomo:666666
skip-auth-prefixes:
  - 127.0.0.1/8
  - ::1/128

experimental:
  quic-go-disable-gso: true  

external-ui: ui
external-ui-name: zashboard
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-controller: 127.0.0.1:9090
secret: 666666

geodata-mode: true
geodata-loader: standard
geo-auto-update: true
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"
  asn: "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb"

profile:
  store-selected: true 
  store-fake-ip: true


sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - '+.push.apple.com'
    # 向日葵远程
    - '*.oray.com'
    - '*.sunlogin.net'

tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  ipv6: false
  prefer-h3: false
  cache-algorithm: arc
  respect-rules: false
  use-hosts: true
  use-system-hosts: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - rule-set:CYaml-Lan
    - rule-set:CText-Lan
    - rule-set:CYaml-Direct
    - rule-set:CText-Direct
    - rule-set:DMrs-Direct
    - rule-set:DMrs-Private
    - geosite:private

    - +.push.apple.com
    - '*.lan'
    - '*.direct'
    - 'stun.*'
    - 'lancache.steamcontent.com'
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - '*.srv.nintendo.net'
    - 'xbox.*.microsoft.com'
    - '*.xboxlive.com'
    - '*.battlenet.com.cn'
    - '*.battlenet.com'
    - '*.blzstatic.cn'
    - '*.battle.net'
    - '*.turn.twilio.com'
    - '*.cmpassport.com'
    - 'id6.me'
    - 'open.e.189.cn'
    - 'mdn.open.wo.cn'
    - 'opencloud.wostore.cn'
    - 'auth.wosms.cn'
    - '*.10099.com.cn'
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
    - 114.114.114.114
    - 180.76.76.76
  nameserver:
    - system
    - quic://223.5.5.5
    - tls://dot.pub:853
    - tls://dns.alidns.com
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - tls://1.1.1.1:853
    - tls://dns.google
    - https://dns.google/dns-query
