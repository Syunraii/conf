# ==========================================================
# 说明: 适用于多条订阅
# ## 节点质量:  优质 > 常规 > 备用 > 临时
# ## 注意: 如果没有多个订阅, 请删除对应行以及用到该锚点的地方, 推荐使用substore管理订阅
# ## 搜索[填入订阅链接]替换订阅链接
# ========================= 基本锚点 =========================
# 订阅信息
BaseProxyProvider: &base_ProxyProvider {type: http, interval: 86400, health-check: {enable: true}}
proxy-providers:
  优质订阅: &myPri {<<: *base_ProxyProvider, url: 填入订阅链接1}
  常规订阅: &myPub {<<: *base_ProxyProvider, url: 填入订阅链接2}
  备用订阅: &myBak {<<: *base_ProxyProvider, url: 填入订阅链接3}
  临时订阅: &myTmp {<<: *base_ProxyProvider, url: 填入订阅链接4}

# 过滤器
# # 倍率过滤
FilterFor_HR: &filterForHR '^(?=.*(?:[2-9][0-9]*|[1-9][0-9]+\.[0-9]+)[×x]).*$'
FilterOut_HR: &filterOutHR '^(?!.*(?:[2-9][0-9]*|[1-9][0-9]*\.[0-9]+)[×x]).*$'

FilterFor_NR: &filterForNR '^(?!.*(?:[2-9][0-9]*|[1-9][0-9]*\.[0-9]+|0\.0?[0-9]+)[×x]).*$'
FilterOut_NR: &filterOutNR '^(?!.*[×x]).*$'

FilterFor_LR: &filterForLR '^(?=.*(?:0\.1[×x]|0\.01[×x]|0\.1\b|0\.0[0-9])).*$'
FilterOut_LR: &filterOutLR '^(?!.*(?:0\.1[×x]|0\.01[×x]|0\.1\b|0\.0[0-9])).*$'

# # 地区+倍率过滤
FilterOutLR_HK: &filterOutLR_HK '^(?i)(?!.*(0\.1[×x]|0\.01[×x]|0\.1\b|0\.0[0-9]))(?=.*(🇭🇰|香港|\b(HK|HongKong|Hong Kong)\b)).*$'
FilterOutLR_TW: &filterOutLR_TW '^(?i)(?!.*(0\.1[×x]|0\.01[×x]|0\.1\b|0\.0[0-9]))(?=.*(🇨🇳|🇹🇼|台湾|\b(TW|Taiwan)\b)).*$'
FilterOutLR_JP: &filterOutLR_JP '^(?i)(?!.*(0\.1[×x]|0\.01[×x]|0\.1\b|0\.0[0-9]))(?=.*(🇯🇵|日本|\b(JP|Japan)\b)).*$'
FilterOutLR_KR: &filterOutLR_KR '^(?i)(?!.*(0\.1[×x]|0\.01[×x]|0\.1\b|0\.0[0-9]))(?=.*(🇰🇷|韩国|\b(KR|South Korea)\b)).*$'
FilterOutLR_US: &filterOutLR_US '^(?i)(?!.*(0\.1[×x]|0\.01[×x]|0\.1\b|0\.0[0-9]))(?=.*(🇺🇸|美国|\b(US|USA|United States)\b)).*$'
FilterOutLR_SG: &filterOutLR_SG '^(?i)(?!.*(0\.1[×x]|0\.01[×x]|0\.1\b|0\.0[0-9]))(?=.*(🇸🇬|新加坡|狮城|\b(SG|Singapore)\b)).*$'
FilterOutLR_OT: &filterOutLR_OT '^(?i)(?!.*(0\.1[×x]|0\.01[×x]|0\.1\b|0\.0[0-9]))(?!.*(🇭🇰|香港|\b(HK|HongKong|Hong Kong)\b|🇨🇳|🇹🇼|台湾|\b(TW|Taiwan)\b|🇯🇵|日本|\b(JP|Japan)\b|🇰🇷|韩国|\b(KR|South Korea)\b|🇺🇸|美国|\b(US|USA|United States)\b|🇸🇬|新加坡|狮城|\b(SG|Singapore)\b)).*$'

# ========================= 核心配置 =========================
ipv6: false
allow-lan: false
unified-delay: true
tcp-concurrent: true
log-level: info
mixed-port: 7893

geodata-mode: false
geo-auto-update: true
geo-update-interval: 72
geox-url:
  mmdb: "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-without-asn.mmdb"

profile:
  store-fake-ip: true
  store-selected: true 

sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - '+.push.apple.com'

tun:
  enable: false
  stack: mixed
  dns-hijack: [any:53]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: false

dns:
  enable: true
  ipv6: false
  prefer-h3: false
  respect-rules: false
  use-hosts: true
  listen: :1053
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-filter-mode: blacklist
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: ['*', '+.lan', '+.local', '+.srv.nintendo.net', 'lancache.steamcontent.com', '+.xboxlive.com', 'xbox.*.microsoft.com', '+.msftncsi.com', '+.msftconnecttest.com', '+.battlenet.com.cn', '+.battlenet.com', '+.blzstatic.cn', '+.battle.net', '+.turn.twilio.com', '+.cmpassport.com', 'id6.me', 'open.e.189.cn', 'mdn.open.wo.cn', 'opencloud.wostore.cn', 'auth.wosms.cn', '+.10099.com.cn']

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
hosts:
  dns.alidns.com: [223.5.5.5,223.6.6.6]
  doh.pub: [1.12.12.21,120.53.53.53]

# ========================= 基本策略组 =========================
# # 基础策略
BaseDirect: &base_direct {type: select, hidden: true, proxies: [DIRECT]}
BaseReject: &base_reject {type: select, hidden: true, proxies: [REJECT]}
