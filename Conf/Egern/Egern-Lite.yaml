# 搜索[填入订阅链接]替换订阅链接

http_port: 6152
socks_port: 6153
vif_only: true
close_connections_on_policy_change: true
hijack_dns:
- '*:53'
geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb
proxy_latency_test_url: http://latency-test.skk.moe/endpoint
dns:
  bootstrap:
  - system
  upstreams:
    DNS-Domestic:
    - 223.5.5.5
    - 119.29.29.29
    DNS-Domestic-Encrypted:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    DNS-Foreign-Encrypted:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  hosts:
    dns.google:
    - 8.8.8.8, 8.8.4.4, 2001:4860:4860::8888, 2001:4860:4860::8844
    cloudflare-dns.com:
    - 104.16.249.249, 104.16.248.249, 2606:4700::6810:f8f9, 2606:4700::6810:f9f9
    dns.alidns.com:
    - 223.5.5.5, 223.6.6.6, 2400:3200:baba::1, 2400:3200::1
    doh.pub:
    - 1.12.12.12, 120.53.53.53
    dot.pub:
    - 1.12.12.12, 120.53.53.53
  proxy_nameservers:
  - 119.29.29.29
  - 223.5.5.5
real_ip_domains:
- +.push.apple.com
- '*.lan'
- '*.direct'
- stun.*
- lancache.steamcontent.com
- '*.msftconnecttest.com'
- '*.msftncsi.com'
- '*.srv.nintendo.net'
- xbox.*.microsoft.com
- '*.xboxlive.com'
- '*.battlenet.com.cn'
- '*.battlenet.com'
- '*.blzstatic.cn'
- '*.battle.net'
- '*.turn.twilio.com'
- '*.cmpassport.com'
- id6.me
- open.e.189.cn
- mdn.open.wo.cn
- opencloud.wostore.cn
- auth.wosms.cn
- '*.10099.com.cn'
policy_groups:
- external:
    name: 🛫 我的订阅
    type: select
    urls:
    - 填入订阅链接
    hidden: true
- fallback:
    name: 🇭🇰 香港自动
    policies:
    - 🎡 自动过滤
    flatten: true
    filter: (?i)🇭🇰|香港|(\b(HK|HongKong|Hong Kong)\b)
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    hidden: true
- fallback:
    name: 🇨🇳 台湾自动
    policies:
    - 🎡 自动过滤
    flatten: true
    filter: (?i)🇨🇳|🇹🇼|台湾|(\b(TW|Taiwan)\b)
